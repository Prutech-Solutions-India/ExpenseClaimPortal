name: Deploy Dev

# Dispatched by the Release Agent only after a human approved gate E.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
      story_key:
        description: Jira story key being promoted
        required: false
        default: ''
      correlation_id:
        description: Orchestrator correlation ID
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          npm ci || (npm install --package-lock-only --no-audit --no-fund && npm ci)
          dotnet restore

      # The bundle is part of the artifact, so it is built before the service
      # is tested or published. Publishing first would package a wwwroot that
      # is empty, and the deployment would serve an API with no UI.
      - name: Build frontend
        run: npx vite build

      - name: Run test suite before packaging
        run: |
          npm run test:unit
          npm run test:integration
          dotnet test --configuration Release --filter "Category!=Smoke"

      - name: Publish
        run: >
          dotnet publish src/PilotService/PilotService.csproj
          --configuration Release --no-restore --output publish

      - name: Package artifact
        run: |
          mkdir -p artifact
          tar -czf artifact/app-${{ github.sha }}.tar.gz publish
          sha256sum artifact/app-${{ github.sha }}.tar.gz > artifact/app-${{ github.sha }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: artifact/

  deploy:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: artifact

      - name: Verify artifact integrity
        run: sha256sum -c artifact/app-${{ github.sha }}.sha256

      - name: Unpack build output
        run: tar -xzf artifact/app-${{ github.sha }}.tar.gz

      - name: Deploy
        env:
          DEPLOY_TARGET: ${{ vars.DEV_DEPLOY_TARGET }}
          DEPLOY_TOKEN: ${{ secrets.DEV_DEPLOY_TOKEN }}
        run: ./scripts/deploy.sh dev "${{ github.sha }}"

  verify:
    name: Post-deploy smoke checks
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fail if there is no URL to smoke test
        env:
          BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "DEV_BASE_URL is not set, so every smoke check would skip and"
            echo "the run would report success against nothing. Set it on the"
            echo "dev environment before promoting."
            exit 1
          fi

      - name: Smoke tests against Dev
        env:
          BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: >
          dotnet test --filter Category=Smoke
          --logger "trx;LogFileName=smoke-dev.trx" --results-directory reports

      # Both layers are checked against the deployment, because a service that
      # answers /health while serving no page is still a failed promotion.
      - name: Frontend smoke tests against Dev
        env:
          BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          npm ci || (npm install --package-lock-only --no-audit --no-fund && npm ci)
          npm run test:smoke

      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-evidence-${{ github.run_id }}
          path: reports/

      - name: Trace
        if: always()
        run: |
          echo "Environment: dev"
          echo "Story: ${{ inputs.story_key }}"
          echo "Correlation ID: ${{ inputs.correlation_id }}"
          echo "Commit: ${{ github.sha }}"
